<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多人 AA 制埋數計算器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .toast {
            transition: all 0.3s ease;
        }
        .modal-overlay {
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 flex justify-center items-start">

<div class="w-full max-w-xl space-y-4 my-2">

    <!-- Header & Action Toolbar -->
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
            <div>
                <h1 class="text-xl font-bold text-indigo-600 flex items-center gap-2">
                    <span>👥</span> 多人 AA 制埋數計算器
                </h1>
                <p class="text-xs text-slate-500 mt-0.5">無雲端依賴 · 本地 JSON 檔案備份/匯入 & QR Code/連結分享</p>
            </div>
            <button onclick="confirmResetData()" class="px-3 py-1.5 text-xs text-rose-500 hover:bg-rose-50 font-bold rounded-lg transition">
                🗑️ 清空當前數據
            </button>
        </div>

        <!-- Sharing & Local File Backup Toolbar -->
        <div id="sharingToolbar" class="mt-4 grid grid-cols-3 gap-2">
            <button onclick="openExportModal()" class="flex items-center justify-center gap-1.5 px-3 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-bold transition shadow-sm">
                <span>📤</span> 導出 JSON 檔案
            </button>
            <button onclick="triggerImportLocalFile()" class="flex items-center justify-center gap-1.5 px-3 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl text-xs font-bold transition shadow-sm">
                <span>📥</span> 匯入 JSON 檔案
            </button>
            <input type="file" id="localFileInput" accept=".json" class="hidden" onchange="handleLocalFileImport(event)">

            <button onclick="showQRCodeModal()" class="flex items-center justify-center gap-1.5 px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition shadow-sm">
                <span>📱</span> 分享帳本 (QR Code / 連結)
            </button>
        </div>
    </div>

    <!-- VIEW: Calculator Main View -->
    <div id="calculatorView" class="space-y-4">
        <!-- 1. Members Section -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
            <h2 class="text-base font-bold text-slate-800 mb-3 pb-2 border-b border-slate-100">1. 參與成員</h2>
            <div class="flex gap-2 mb-3">
                <input type="text" id="personName" placeholder="輸入成員名字（例如：阿明、小紅）" 
                       onkeypress="handlePersonKeyPress(event)"
                       class="flex-1 px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="addPerson()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl transition">
                    新增
                </button>
            </div>
            <div class="flex flex-wrap gap-2 min-h-[32px]" id="peopleList"></div>
        </div>

        <!-- 2. Add Expense Section -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
            <h2 class="text-base font-bold text-slate-800 mb-3 pb-2 border-b border-slate-100">2. 新增消費項目</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-3">
                <input type="text" id="itemName" placeholder="項目名稱（例：晚餐 / 計程車）" 
                       class="px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <input type="number" id="itemAmount" placeholder="金額 ($)" step="0.1" min="0" 
                       class="px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div class="mb-3">
                <label class="text-xs font-bold text-slate-600 block mb-1">付款人：</label>
                <select id="payerSelect" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white"></select>
            </div>

            <div class="mb-3">
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs font-bold text-slate-600">參與平分的人：</label>
                    <div class="space-x-1">
                        <button onclick="selectAllSharers(true)" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-2 py-0.5 rounded">全選</button>
                        <button onclick="selectAllSharers(false)" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-2 py-0.5 rounded">全不選</button>
                    </div>
                </div>
                <div class="flex flex-wrap gap-2 p-3 bg-slate-50 border border-slate-200 rounded-xl" id="sharerCheckboxes"></div>
            </div>

            <button onclick="addItem()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl transition shadow-sm">
                ➕ 新增消費項目
            </button>
        </div>

        <!-- 3. Expense List -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
            <h2 class="text-base font-bold text-slate-800 mb-3 pb-2 border-b border-slate-100">3. 消費明細</h2>
            <ul id="itemList" class="divide-y divide-slate-100"></ul>
        </div>

        <!-- 4. Settlement Calculation -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
            <h2 class="text-base font-bold text-slate-800 mb-3 pb-2 border-b border-slate-100">4. 結算方案（最簡轉賬）</h2>
            <button onclick="calculate()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-xl transition shadow-sm">
                🧮 計算埋數
            </button>

            <div id="resultContainer" class="hidden mt-4 pt-3 border-t border-slate-100">
                <p id="totalExpense" class="font-bold text-slate-800 text-sm mb-2"></p>
                <div id="settlementList" class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 space-y-1.5 mb-3 text-sm"></div>
                <button onclick="copyResultsText()" class="w-full py-2 bg-slate-700 hover:bg-slate-800 text-white text-xs font-bold rounded-xl transition">
                    📋 複製文字結算報告
                </button>
            </div>
        </div>
    </div>

</div>

<!-- Toast Notification Container -->
<div id="toastContainer" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>

<!-- Modal 1: Export Bill to Local File -->
<div id="exportModal" class="modal-overlay fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-center p-4 opacity-0 pointer-events-none">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl">
        <h3 class="text-lg font-bold text-slate-800 mb-1">📤 導出帳本為本地 JSON 檔案</h3>
        <p class="text-xs text-slate-500 mb-3">輸入此帳冊名稱，系統會生成可離線保存的數據檔案：</p>
        
        <input type="text" id="exportTitleInput" placeholder="例如：2026 日本關西之旅 / 9月生日餐" 
               class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 mb-3">

        <div class="flex gap-2">
            <button onclick="executeExportToFile()" class="flex-1 py-2 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-xl">
                📥 下載 JSON 檔案
            </button>
            <button onclick="closeModal('exportModal')" class="flex-1 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold rounded-xl">
                取消
            </button>
        </div>
    </div>
</div>

<!-- Modal 2: Import Local File Preview -->
<div id="importPreviewModal" class="modal-overlay fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-center p-4 opacity-0 pointer-events-none">
    <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-xl">
        <h3 class="text-lg font-bold text-slate-800 mb-1">📥 檢視並匯入本地帳本檔案</h3>
        <p class="text-xs text-slate-500 mb-3">已成功讀取 JSON 檔案內容，確認後將載入至計算器：</p>
        
        <div id="importPreviewContent" class="space-y-2 text-xs bg-slate-50 p-3 rounded-xl border border-slate-200 mb-4"></div>

        <div class="flex gap-2">
            <button id="confirmImportBtn" class="flex-1 py-2 bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold rounded-xl">
                確認載入至計算器
            </button>
            <button onclick="closeModal('importPreviewModal')" class="flex-1 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold rounded-xl">
                取消
            </button>
        </div>
    </div>
</div>

<!-- Modal 3: Merged QR Code & Copy Share Link Modal -->
<div id="qrModal" class="modal-overlay fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-center p-4 opacity-0 pointer-events-none">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center shadow-xl">
        <h3 class="text-lg font-bold text-slate-800 mb-1">📱 分享帳本 (QR Code / 連結)</h3>
        <p class="text-xs text-slate-500 mb-3">供朋友用手機相機直接掃描，或複製網址連結發送至群組：</p>
        
        <div class="flex justify-center p-3 bg-slate-50 border border-slate-200 rounded-2xl mb-3">
            <div id="qrcodeCanvas"></div>
        </div>

        <div class="mb-4">
            <input type="text" id="shareUrlInput" readonly 
                   class="w-full px-2.5 py-1.5 bg-slate-100 border border-slate-200 rounded-lg text-[11px] text-slate-600 text-center select-all focus:outline-none">
        </div>

        <div class="flex gap-2">
            <button onclick="copyShareableLinkFromModal()" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl transition shadow-sm">
                📋 複製分享連結
            </button>
            <button onclick="closeModal('qrModal')" class="flex-1 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold rounded-xl">
                關閉
            </button>
        </div>
    </div>
</div>

<script>
    let people = [];
    let items = [];
    let pendingImportData = null;
    let latestTransactions = [];
    let latestTotalExpense = 0;

    function saveData() {
        try {
            localStorage.setItem('aa_cal_people', JSON.stringify(people));
            localStorage.setItem('aa_cal_items', JSON.stringify(items));
        } catch(e) {
            console.error("Failed to save to local storage", e);
        }
    }

    function loadData() {
        try {
            const savedPeople = localStorage.getItem('aa_cal_people');
            const savedItems = localStorage.getItem('aa_cal_items');

            people = savedPeople ? JSON.parse(savedPeople) : [];
            items = savedItems ? JSON.parse(savedItems) : [];
        } catch(e) {
            people = [];
            items = [];
        }
    }

    function openExportModal() {
        if (people.length === 0 && items.length === 0) {
            return showToast('目前沒有任何成員或消費資料可導出', 'warning');
        }
        const dateStr = new Date().toLocaleDateString('zh-HK').replace(/\//g, '-');
        document.getElementById('exportTitleInput').value = `AA帳單_${dateStr}`;
        openModal('exportModal');
    }

    function executeExportToFile() {
        const titleInput = document.getElementById('exportTitleInput');
        const title = titleInput.value.trim() || `AA帳單_${new Date().toISOString().slice(0,10)}`;

        let totalAmt = 0;
        items.forEach(i => totalAmt += i.amount);

        const billRecord = {
            version: '1.0',
            title: title,
            exportDate: new Date().toLocaleString('zh-HK'),
            totalAmount: totalAmt,
            people: people,
            items: items
        };

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(billRecord, null, 2));
        const downloadAnchor = document.createElement('a');
        const sanitizedTitle = title.replace(/[/\\?%*:|"<>]/g, '_');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `${sanitizedTitle}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();

        closeModal('exportModal');
        showToast(`🎉 成功導出帳本檔案 [${sanitizedTitle}.json]！`, 'success');
    }

    function triggerImportLocalFile() {
        document.getElementById('localFileInput').click();
    }

    function handleLocalFileImport(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data && Array.isArray(data.people) && Array.isArray(data.items)) {
                    pendingImportData = data;

                    let previewHtml = `
                        <div><b>帳冊標題：</b> ${escapeHtml(data.title || '無標題')}</div>
                        <div><b>匯出時間：</b> ${escapeHtml(data.exportDate || '未知')}</div>
                        <div><b>參與成員 (${data.people.length} 人)：</b> ${data.people.map(p => escapeHtml(p)).join(', ')}</div>
                        <div><b>消費項目 (${data.items.length} 項)：</b> 總計 $${(data.totalAmount || 0).toFixed(1)}</div>
                    `;
                    document.getElementById('importPreviewContent').innerHTML = previewHtml;

                    document.getElementById('confirmImportBtn').onclick = applyImportedBill;
                    openModal('importPreviewModal');
                } else {
                    showToast('無效的 AA 制帳本 JSON 檔案結構', 'warning');
                }
            } catch(err) {
                showToast('讀取 JSON 檔案失敗，請確保格式正確', 'warning');
            }
            event.target.value = '';
        };
        reader.readAsText(file);
    }

    function applyImportedBill() {
        if (!pendingImportData) return;

        people = JSON.parse(JSON.stringify(pendingImportData.people));
        items = JSON.parse(JSON.stringify(pendingImportData.items));

        saveData();
        updatePeopleUI();
        updateItemsUI();
        document.getElementById('resultContainer').classList.add('hidden');

        closeModal('importPreviewModal');
        showToast(`🎉 已成功載入帳冊：「${pendingImportData.title || '匯入帳單'}」！`, 'success');
        pendingImportData = null;
    }

    function generateCompressedDataPayload() {
        const payload = { p: people, i: items };
        const jsonStr = JSON.stringify(payload);
        return btoa(encodeURIComponent(jsonStr));
    }

    function parseDataPayload(encodedStr) {
        try {
            const jsonStr = decodeURIComponent(atob(encodedStr.trim()));
            const parsed = JSON.parse(jsonStr);
            if (Array.isArray(parsed.p) && Array.isArray(parsed.i)) {
                return { people: parsed.p, items: parsed.i };
            }
        } catch(e) {
            console.error("Failed to parse data payload", e);
        }
        return null;
    }

    function showQRCodeModal() {
        if (people.length === 0 && items.length === 0) {
            return showToast('目前沒有任何成員或消費資料可分享', 'warning');
        }

        const encodedData = generateCompressedDataPayload();
        const shareUrl = window.location.origin + window.location.pathname + '#data=' + encodedData;

        document.getElementById('shareUrlInput').value = shareUrl;

        const container = document.getElementById('qrcodeCanvas');
        container.innerHTML = '';
        
        new QRCode(container, {
            text: shareUrl,
            width: 200,
            height: 200,
            colorDark: "#1e293b",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.L
        });

        openModal('qrModal');
    }

    function copyShareableLinkFromModal() {
        const shareUrl = document.getElementById('shareUrlInput').value;
        if (!shareUrl) return;

        const tempInput = document.createElement('input');
        tempInput.value = shareUrl;
        document.body.appendChild(tempInput);
        tempInput.select();
        try {
            document.execCommand('copy');
            showToast('已成功複製分享連結！可直接發送至聊天群組', 'success');
        } catch(e) {
            showToast('複製失敗，請手動複製網址', 'warning');
        }
        document.body.removeChild(tempInput);
    }

    function addPerson() {
        const input = document.getElementById('personName');
        const name = input.value.trim();
        if (!name) return showToast('請輸入成員名字', 'warning');
        if (people.includes(name)) return showToast('成員名字不能重複', 'warning');

        people.push(name);
        input.value = '';
        saveData();
        updatePeopleUI();
        showToast(`已新增成員：${name}`, 'success');
    }

    function removePerson(name) {
        people = people.filter(p => p !== name);
        items.forEach(item => {
            item.sharers = item.sharers.filter(s => s !== name);
        });
        items = items.filter(item => item.payer !== name && item.sharers.length > 0);

        saveData();
        updatePeopleUI();
        updateItemsUI();
        document.getElementById('resultContainer').classList.add('hidden');
        showToast(`已移除成員：${name}`);
    }

    function updatePeopleUI() {
        const peopleList = document.getElementById('peopleList');
        const payerSelect = document.getElementById('payerSelect');
        const sharerCheckboxes = document.getElementById('sharerCheckboxes');

        if (people.length === 0) {
            peopleList.innerHTML = '<div class="text-xs text-slate-400 py-1">尚未新增成員</div>';
            payerSelect.innerHTML = '<option value="">請先新增成員</option>';
            sharerCheckboxes.innerHTML = '<div class="text-xs text-slate-400 py-1">尚未新增成員</div>';
            return;
        }

        peopleList.innerHTML = people.map(p => `
            <span class="inline-flex items-center gap-1.5 bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-xs font-semibold">
                ${escapeHtml(p)}
                <button onclick="removePerson('${escapeJs(p)}')" class="hover:bg-indigo-100 rounded-full w-4 h-4 flex items-center justify-center text-xs">✕</button>
            </span>
        `).join('');

        const currPayer = payerSelect.value;
        payerSelect.innerHTML = people.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');
        if (people.includes(currPayer)) payerSelect.value = currPayer;

        sharerCheckboxes.innerHTML = people.map(p => `
            <label class="inline-flex items-center gap-1.5 text-xs text-slate-700 cursor-pointer select-none">
                <input type="checkbox" value="${escapeHtml(p)}" checked class="rounded text-indigo-600 focus:ring-indigo-500"> ${escapeHtml(p)}
            </label>
        `).join('');
    }

    function selectAllSharers(checked) {
        const checkboxes = document.querySelectorAll('#sharerCheckboxes input[type="checkbox"]');
        checkboxes.forEach(cb => cb.checked = checked);
    }

    function addItem() {
        const nameInput = document.getElementById('itemName');
        const amountInput = document.getElementById('itemAmount');
        const payerSelect = document.getElementById('payerSelect');

        const name = nameInput.value.trim() || '未命名消費';
        const amount = parseFloat(amountInput.value);
        const payer = payerSelect.value;

        const checkboxes = document.querySelectorAll('#sharerCheckboxes input[type="checkbox"]:checked');
        const sharers = Array.from(checkboxes).map(cb => cb.value);

        if (isNaN(amount) || amount <= 0) return showToast('請輸入有效的金額', 'warning');
        if (!payer || !people.includes(payer)) return showToast('請先新增並選擇付款人', 'warning');
        if (sharers.length === 0) return showToast('請至少選擇一位平分者', 'warning');

        items.push({ id: Date.now(), name, amount, payer, sharers });

        nameInput.value = '';
        amountInput.value = '';

        saveData();
        updateItemsUI();
        document.getElementById('resultContainer').classList.add('hidden');
        showToast(`已新增：${name} ($${amount.toFixed(1)})`, 'success');
    }

    function removeItem(id) {
        items = items.filter(item => item.id !== id);
        saveData();
        updateItemsUI();
        document.getElementById('resultContainer').classList.add('hidden');
        showToast('已刪除消費項目');
    }

    function updateItemsUI() {
        const itemList = document.getElementById('itemList');
        if (items.length === 0) {
            itemList.innerHTML = '<li class="text-xs text-slate-400 py-3 text-center">尚未新增消費項目</li>';
            return;
        }

        itemList.innerHTML = items.map(item => `
            <li class="py-2.5 flex justify-between items-center text-xs">
                <div>
                    <div class="font-bold text-slate-800 text-sm">${escapeHtml(item.name)} - <span class="text-indigo-600">$${item.amount.toFixed(1)}</span></div>
                    <div class="text-slate-500 mt-0.5">由 <b>${escapeHtml(item.payer)}</b> 付款 | 平分: ${item.sharers.map(s => escapeHtml(s)).join(', ')}</div>
                </div>
                <button onclick="removeItem(${item.id})" class="text-rose-500 hover:bg-rose-50 px-2 py-1 rounded text-xs font-semibold">刪除</button>
            </li>
        `).join('');
    }

    function calculate() {
        if (people.length === 0) return showToast('請先新增成員', 'warning');
        if (items.length === 0) return showToast('請先新增消費項目', 'warning');

        const balances = {};
        people.forEach(p => balances[p] = 0);
        let totalExpense = 0;

        items.forEach(item => {
            totalExpense += item.amount;
            if (balances.hasOwnProperty(item.payer)) balances[item.payer] += item.amount;
            
            const split = item.amount / item.sharers.length;
            item.sharers.forEach(s => {
                if (balances.hasOwnProperty(s)) balances[s] -= split;
            });
        });

        const debtors = [];
        const creditors = [];

        Object.keys(balances).forEach(person => {
            const amt = balances[person];
            if (amt < -0.01) debtors.push({ name: person, amount: -amt });
            else if (amt > 0.01) creditors.push({ name: person, amount: amt });
        });

        const transactions = [];
        let i = 0, j = 0;

        while (i < debtors.length && j < creditors.length) {
            const debtor = debtors[i];
            const creditor = creditors[j];
            const minAmt = Math.min(debtor.amount, creditor.amount);

            transactions.push({ from: debtor.name, to: creditor.name, amount: minAmt });
            debtor.amount -= minAmt;
            creditor.amount -= minAmt;

            if (debtor.amount < 0.01) i++;
            if (creditor.amount < 0.01) j++;
        }

        latestTransactions = transactions;
        latestTotalExpense = totalExpense;

        document.getElementById('totalExpense').innerText = `💰 總花費金額：$${totalExpense.toFixed(1)}`;
        const settlementList = document.getElementById('settlementList');

        if (transactions.length === 0) {
            settlementList.innerHTML = '<div class="text-emerald-800 font-bold">🎉 大家金額剛好平手，不需要轉賬！</div>';
        } else {
            settlementList.innerHTML = transactions.map(t => `
                <div class="text-emerald-900 font-semibold">
                    👉 <b>${escapeHtml(t.from)}</b> 給 <b>${escapeHtml(t.to)}</b> ： <span class="text-amber-600 font-bold">$${t.amount.toFixed(1)}</span>
                </div>
            `).join('');
        }

        document.getElementById('resultContainer').classList.remove('hidden');
    }

    function copyResultsText() {
        if (latestTransactions.length === 0 && latestTotalExpense === 0) return;

        let text = `📊 【AA 制埋數結算帳單】\n💰 總花費：$${latestTotalExpense.toFixed(1)}\n-------------------\n`;
        if (latestTransactions.length === 0) {
            text += '🎉 大家金額剛好平手，不需要額外轉賬！';
        } else {
            text += '轉賬方案：\n';
            latestTransactions.forEach(t => {
                text += `• ${t.from} ➡️ ${t.to} : $${t.amount.toFixed(1)}\n`;
            });
        }

        const tempInput = document.createElement('textarea');
        tempInput.value = text;
        document.body.appendChild(tempInput);
        tempInput.select();
        try {
            document.execCommand('copy');
            showToast('已成功複製結算報告！', 'success');
        } catch (e) {
            showToast('複製失敗', 'warning');
        }
        document.body.removeChild(tempInput);
    }

    function openModal(id) {
        const modal = document.getElementById(id);
        modal.classList.remove('opacity-0', 'pointer-events-none');
    }

    function closeModal(id) {
        const modal = document.getElementById(id);
        modal.classList.add('opacity-0', 'pointer-events-none');
    }

    function confirmResetData() {
        if (confirm('確定要清空當前的所有成員與消費數據嗎？此動作無法復原。')) {
            people = [];
            items = [];
            saveData();
            updatePeopleUI();
            updateItemsUI();
            document.getElementById('resultContainer').classList.add('hidden');
            showToast('已清空當前數據');
        }
    }

    function showToast(message, type = 'normal') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast px-4 py-2.5 rounded-xl text-xs font-bold shadow-lg pointer-events-auto text-white ${
            type === 'warning' ? 'bg-rose-500' : type === 'success' ? 'bg-emerald-600' : 'bg-slate-800'
        }`;
        toast.innerText = message;
        container.appendChild(toast);

        setTimeout(() => toast.remove(), 2600);
    }

    function handlePersonKeyPress(e) {
        if (e.key === 'Enter') addPerson();
    }

    function escapeHtml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escapeJs(str) {
        return String(str).replace(/'/g, "\\'");
    }

    window.addEventListener('load', () => {
        if (window.location.hash && window.location.hash.includes('data=')) {
            const hashData = window.location.hash.split('data=')[1];
            const parsed = parseDataPayload(hashData);
            if (parsed) {
                people = parsed.people;
                items = parsed.items;
                saveData();
                showToast('🎉 已自動從分享連結載入帳目數據！', 'success');
                history.replaceState(null, "", window.location.pathname);
            }
        } else {
            loadData();
        }

        updatePeopleUI();
        updateItemsUI();
    });
</script>
</body>
</html>
