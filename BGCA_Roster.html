<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在校課後託管導師報更及課室分配</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (xlsx) for Excel export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-500 p-2.5 rounded-xl shadow-inner">
                    <i class="fa-solid fa-calendar-days text-2xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">在校課後託管導師報更及課室分配</h1>
                    <div class="flex items-center gap-2 mt-1">
                        <select id="selectedYear" onchange="changeMonthYear()" class="bg-indigo-700 text-white text-xs px-2 py-1 rounded border border-indigo-500 focus:outline-none font-medium">
                            <option value="2025">2025年</option>
                            <option value="2026" selected>2026年</option>
                            <option value="2027">2027年</option>
                        </select>
                        <select id="selectedMonth" onchange="changeMonthYear()" class="bg-indigo-700 text-white text-xs px-2 py-1 rounded border border-indigo-500 focus:outline-none font-medium">
                            <option value="1">1月</option>
                            <option value="2">2月</option>
                            <option value="3">3月</option>
                            <option value="4">4月</option>
                            <option value="5">5月</option>
                            <option value="6">6月</option>
                            <option value="7">7月</option>
                            <option value="8">8月</option>
                            <option value="9">9月</option>
                            <option value="10">10月</option>
                            <option value="11">11月</option>
                            <option value="12">12月</option>
                        </select>
                        <span id="monthSubtitle" class="text-indigo-200 text-sm"></span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-3 flex-wrap">
                <!-- CSV Import Button -->
                <label class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 rounded-lg text-sm font-medium transition shadow-sm flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-file-arrow-up"></i> 匯入 CSV 報更表
                    <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="handleCsvImport(event)">
                </label>
                <!-- Room Assignment Button -->
                <button onclick="openRoomAssignmentModal()" class="px-3.5 py-2 bg-amber-500 hover:bg-amber-600 rounded-lg text-sm font-medium transition shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-door-open"></i> 課室分配矩陣
                </button>
                <button id="viewCalendarBtn" onclick="switchView('calendar')" class="px-3.5 py-2 bg-indigo-700 hover:bg-indigo-800 rounded-lg text-sm font-medium transition shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-calendar"></i> 月曆檢視
                </button>
                <button id="viewTutorBtn" onclick="switchView('tutor')" class="px-3.5 py-2 bg-indigo-500 hover:bg-indigo-600 rounded-lg text-sm font-medium transition shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-user-graduate"></i> 導師檢視
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex-grow w-full">
        <!-- Controls & Filters Bar -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3 w-full md:w-auto flex-wrap">
                <div class="relative w-full md:w-80">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-search"></i>
                    </span>
                    <input type="text" id="searchInput" oninput="filterData()" placeholder="搜尋導師姓名..." 
                        class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                </div>
                <select id="shiftFilter" onchange="filterData()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="all">所有更次類型 (全 / 功)</option>
                    <option value="full">全節 (15:00-18:00)</option>
                    <option value="homework">功課節 (15:30-17:00)</option>
                </select>
                <span id="dataSourceBadge" class="text-xs px-3 py-1 bg-slate-100 text-slate-600 rounded-lg font-medium">使用預設數據</span>
            </div>
            <div class="flex items-center gap-4 text-xs font-medium text-slate-600">
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span> 全節 (15:00-18:00)</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span> 功課節 (15:30-17:00)</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-slate-300 inline-block"></span> 假期/停課</span>
            </div>
        </div>

        <!-- Calendar View Container (Monday start: Mon, Tue, Wed, Thu, Fri, Sat, Sun) -->
        <div id="calendarView" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-7 gap-3 text-center font-semibold text-slate-500 text-sm hidden md:grid">
                <div class="py-2">星期一</div>
                <div class="py-2">星期二</div>
                <div class="py-2">星期三</div>
                <div class="py-2">星期四</div>
                <div class="py-2">星期五</div>
                <div class="py-2">星期六</div>
                <div class="py-2">星期日</div>
            </div>
            <!-- Calendar Grid -->
            <div id="calendarGrid" class="grid grid-cols-1 md:grid-cols-7 gap-4">
                <!-- Dynamically injected by JS -->
            </div>
        </div>

        <!-- Tutor View Container -->
        <div id="tutorView" class="hidden space-y-6">
            <div id="tutorListContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Dynamically injected by JS -->
            </div>
        </div>

    </main>

    <!-- Modal for Day Details -->
    <div id="dayModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full overflow-hidden transform transition-all">
            <div class="bg-indigo-600 text-white px-6 py-4 flex justify-between items-center">
                <h3 id="modalTitle" class="text-lg font-bold">日期詳情</h3>
                <button onclick="closeModal()" class="text-indigo-200 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div id="modalBody" class="p-6 max-h-[70vh] overflow-y-auto space-y-4">
                <!-- Modal content -->
            </div>
            <div class="bg-slate-50 px-6 py-3 flex justify-end">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-sm font-medium transition">關閉</button>
            </div>
        </div>
    </div>

    <div id="roomAssignmentModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-7xl w-full overflow-hidden transform transition-all flex flex-col h-[90vh]">
            <div class="bg-amber-600 text-white px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-3 shrink-0">
                <div class="flex items-center gap-3">
                    <div class="bg-amber-500 p-2.5 rounded-xl shadow-inner">
                        <i class="fa-solid fa-door-open text-xl text-white"></i>
                    </div>
                    <div>
                        <h3 class="text-lg font-bold">在校課後託管導師報更及課室分配矩陣管理</h3>
                        <p class="text-amber-100 text-xs">管理每週導師於不同課室的當值分配（每位導師每日限配一室，並可設定全節或功課節）</p>
                    </div>
                </div>
                <!-- Week selector & Add room controls -->
                <div class="flex items-center gap-2 flex-wrap">
                    <select id="matrixWeekSelect" onchange="renderRoomMatrix()" class="px-3 py-2 bg-amber-700 text-white border border-amber-500 rounded-xl text-xs font-medium focus:outline-none">
                        <!-- Weeks options injected dynamically -->
                    </select>
                    <div class="flex items-center bg-white rounded-xl overflow-hidden border border-amber-500">
                        <input type="text" id="newRoomInput" placeholder="新課室名稱..." class="px-3 py-1.5 text-xs text-slate-800 focus:outline-none w-32 sm:w-40">
                        <button onclick="addRoom()" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white text-xs font-medium transition flex items-center gap-1">
                            <i class="fa-solid fa-plus"></i> 新增課室
                        </button>
                    </div>
                </div>
            </div>

            <!-- Matrix Table Container with flex-grow & proper scrolling -->
            <div class="p-6 bg-slate-50 flex-grow overflow-hidden flex flex-col">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex-grow flex flex-col">
                    <div class="overflow-auto flex-grow" id="matrixTableContainer">
                        <!-- Injected Matrix Table -->
                    </div>
                </div>
            </div>

            <div class="bg-white px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-3 border-t border-slate-200 shrink-0">
                <div class="flex items-center gap-2 flex-wrap">
                    <button onclick="autoAssignMatrixWeek()" class="px-3.5 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> 自動隨機分配本週
                    </button>
                    <button onclick="checkUnassignedRooms()" class="px-3.5 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
                        <i class="fa-solid fa-triangle-exclamation"></i> 檢查未分配課室
                    </button>
                    <button onclick="exportRoomAssignmentExcel()" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-semibold transition shadow-sm flex items-center gap-1.5">
                        <i class="fa-solid fa-file-excel"></i> 匯出 Excel (月曆格式總表)
                    </button>
                    <button onclick="exportDataBackup()" class="px-3.5 py-2 bg-cyan-600 hover:bg-cyan-700 text-white rounded-xl text-xs font-semibold transition shadow-sm flex items-center gap-1.5">
                        <i class="fa-solid fa-cloud-arrow-down"></i> 備份數據 (JSON)
                    </button>
                    <label class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-semibold transition shadow-sm flex items-center gap-1.5 cursor-pointer">
                        <i class="fa-solid fa-cloud-arrow-up"></i> 還原備份
                        <input type="file" id="importJsonInput" accept=".json" class="hidden" onchange="importDataBackup(event)">
                    </label>
                </div>
                <button onclick="closeRoomAssignmentModal()" class="px-5 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-sm font-medium transition">完成並關閉</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg z-50 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-3 text-sm">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMessage">提示訊息</span>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
            在校課後託管導師報更及課室分配管理系統 &copy; 2025
        </div>
    </footer>

    <script>
        let rawData = [];

        let currentYear = 2026;
        let currentMonth = 10; // 1-12
        let activeDateKeys = [];
        let calendarWeeks = [];
        let roomList = ["室內活動室 (Activity Room)", "導管室 A (Room A)", "導管室 B (Room B)", "電腦室 (Computer Room)"];
        let roomAssignments = {}; // Format: { "YYYY-MM-DD": { "Room Name": [{ name: "Tutor 1", slot: "全" }, ...] } }

        function buildCalendarStructure() {
            activeDateKeys = [];
            calendarWeeks = [];

            const totalDays = new Date(currentYear, currentMonth, 0).getDate();
            const dayNames = ['(日)', '(一)', '(二)', '(三)', '(四)', '(五)', '(六)'];
            for (let d = 1; d <= totalDays; d++) {
                let dateObj = new Date(currentYear, currentMonth - 1, d);
                let dayOfWeek = dateObj.getDay();
                let dayNameStr = dayNames[dayOfWeek];
                let dateKey = `${d}/${currentMonth}/${currentYear} ${dayNameStr}`;
                activeDateKeys.push(dateKey);
            }

            let firstDayOfMonth = new Date(currentYear, currentMonth - 1, 1).getDay();
            let firstDayMonBased = (firstDayOfMonth === 0) ? 6 : firstDayOfMonth - 1;

            let currentWeekDays = [];
            for (let i = 0; i < firstDayMonBased; i++) {
                currentWeekDays.push({ dayNum: null, dateStr: null, isSpacer: true });
            }

            let weekCounter = 1;
            for (let d = 1; d <= totalDays; d++) {
                let dateObj = new Date(currentYear, currentMonth - 1, d);
                let jsDay = dateObj.getDay();
                let monBasedDay = (jsDay === 0) ? 6 : jsDay - 1;

                let dateStrMatch = activeDateKeys.find(k => k.startsWith(`${d}/${currentMonth}/${currentYear} `));
                let isHoliday = (jsDay === 0 || jsDay === 6);

                currentWeekDays.push({
                    dayNum: d,
                    dateStr: dateStrMatch,
                    dayOfWeek: jsDay,
                    isHolidayOrSpecial: isHoliday
                });

                if (monBasedDay === 6 || d === totalDays) {
                    while (currentWeekDays.length < 7) {
                        currentWeekDays.push({ dayNum: null, dateStr: null, isSpacer: true });
                    }
                    calendarWeeks.push({
                        title: `第 ${weekCounter} 週`,
                        days: [...currentWeekDays]
                    });
                    currentWeekDays = [];
                    weekCounter++;
                }
            }

            document.getElementById('monthSubtitle').innerText = `${currentYear}年${currentMonth}月 (共 ${totalDays} 天)`;
            document.getElementById('selectedYear').value = currentYear;
            document.getElementById('selectedMonth').value = currentMonth;
        }

        function changeMonthYear() {
            currentYear = parseInt(document.getElementById('selectedYear').value);
            currentMonth = parseInt(document.getElementById('selectedMonth').value);
            buildCalendarStructure();
            renderViews();
            showToast(`已切換至 ${currentYear}年 ${currentMonth}月`);
        }

        let currentView = 'calendar';

        function switchView(view) {
            currentView = view;
            const calBtn = document.getElementById('viewCalendarBtn');
            const tutBtn = document.getElementById('viewTutorBtn');
            const calView = document.getElementById('calendarView');
            const tutView = document.getElementById('tutorView');

            if (view === 'calendar') {
                calBtn.className = "px-3.5 py-2 bg-indigo-700 hover:bg-indigo-800 rounded-lg text-sm font-medium transition shadow-sm flex items-center gap-2";
                tutBtn.className = "px-3.5 py-2 bg-indigo-500 hover:bg-indigo-600 rounded-lg text-sm font-medium transition shadow-sm flex items-center gap-2";
                calView.classList.remove('hidden');
                tutView.classList.add('hidden');
            } else {
                tutBtn.className = "px-3.5 py-2 bg-indigo-700 hover:bg-indigo-800 rounded-lg text-sm font-medium transition shadow-sm flex items-center gap-2";
                calBtn.className = "px-3.5 py-2 bg-indigo-500 hover:bg-indigo-600 rounded-lg text-sm font-medium transition shadow-sm flex items-center gap-2";
                tutView.classList.remove('hidden');
                calView.classList.add('hidden');
            }
            renderViews();
        }

        function filterData() {
            renderViews();
        }

        function renderViews() {
            const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
            const shiftVal = document.getElementById('shiftFilter').value;

            renderCalendar(searchVal, shiftVal);
            renderTutors(searchVal, shiftVal);
        }

        function renderCalendar(searchQuery, shiftFilter) {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            if (rawData.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-16 bg-white rounded-2xl border border-dashed border-slate-300 text-center">
                        <div class="inline-flex bg-indigo-50 p-4 rounded-full text-indigo-600 mb-3 text-2xl">
                            <i class="fa-solid fa-file-arrow-up"></i>
                        </div>
                        <h3 class="text-base font-bold text-slate-700">尚未載入導師報更數據</h3>
                        <p class="text-xs text-slate-500 mt-1 max-w-sm mx-auto">請點擊頂部的 <span class="font-semibold text-emerald-600">「匯入 CSV 報更表」</span> 按鈕上載您的報更 CSV 檔案，或還原備份資料。</p>
                    </div>
                `;
                return;
            }

            calendarWeeks.forEach(week => {
                week.days.forEach(item => {
                    if (item.isSpacer) {
                        const spacer = document.createElement('div');
                        spacer.className = "hidden md:block bg-slate-100/50 rounded-2xl min-h-[140px] border border-dashed border-slate-200";
                        grid.appendChild(spacer);
                        return;
                    }

                    const card = document.createElement('div');
                    let isWeekend = (item.dayOfWeek === 0 || item.dayOfWeek === 6);
                    
                    let activeTutors = [];
                    if (item.dateStr) {
                        rawData.forEach(tutor => {
                            if (searchQuery && !tutor.name.toLowerCase().includes(searchQuery)) return;
                            let shift = tutor.shifts[item.dateStr];
                            if (!shift) {
                                let foundKey = Object.keys(tutor.shifts).find(k => k.startsWith(`${item.dayNum}/${currentMonth}/`));
                                if (foundKey) shift = tutor.shifts[foundKey];
                            }
                            if (shift && shift !== "不能出席" && shift.trim() !== "") {
                                if (shiftFilter === 'all' || 
                                   (shiftFilter === 'full' && (shift.includes("全節") || shift.includes("15:00"))) ||
                                   (shiftFilter === 'homework' && (shift.includes("功課節") || shift.includes("15:30")))) {
                                    activeTutors.push({ name: tutor.name, shift: shift });
                                }
                            }
                        });
                    }

                    let bgClass = "bg-white";
                    let borderClass = "border-slate-200";
                    if (item.isHolidayOrSpecial) {
                        bgClass = "bg-slate-50";
                        borderClass = "border-slate-200/60";
                    }

                    card.className = `${bgClass} border ${borderClass} rounded-2xl p-3.5 flex flex-col justify-between shadow-sm hover:shadow-md transition min-h-[160px] relative overflow-hidden`;
                    
                    let dayNames = ['日','一','二','三','四','五','六'];
                    let headerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <span class="font-bold text-slate-700 text-base">${currentMonth}/${item.dayNum}</span>
                            <span class="text-xs px-2 py-0.5 rounded-full font-medium ${isWeekend ? 'bg-rose-100 text-rose-600' : 'bg-slate-100 text-slate-500'}">
                                ${dayNames[item.dayOfWeek]}
                            </span>
                        </div>
                    `;

                    let bodyHTML = '';
                    if (item.isHolidayOrSpecial) {
                        let reason = isWeekend ? "週末假期" : "假期/停課";
                        bodyHTML = `
                            <div class="flex-grow flex items-center justify-center text-center py-4">
                                <span class="text-xs text-slate-400 font-medium bg-slate-200/60 px-2.5 py-1 rounded-lg">${reason}</span>
                            </div>
                        `;
                    } else {
                        let roomSummaryHTML = '';
                        if (item.dateStr && roomAssignments[item.dateStr]) {
                            let assignedCount = Object.values(roomAssignments[item.dateStr]).reduce((acc, tArr) => acc + tArr.length, 0);
                            if (assignedCount > 0) {
                                roomSummaryHTML = `<div class="mb-1 text-[11px] bg-amber-50 text-amber-700 px-2 py-0.5 rounded border border-amber-200 font-medium flex items-center gap-1">
                                    <i class="fa-solid fa-door-open"></i> 已分配 ${assignedCount} 位導師至課室
                                </div>`;
                            }
                        }

                        if (activeTutors.length === 0) {
                            bodyHTML = `
                                <div class="flex-grow flex items-center justify-center text-center py-4">
                                    <span class="text-xs text-slate-400 italic">無符合導師更次</span>
                                </div>
                            `;
                        } else {
                            let maxDisplay = 2;
                            let displayed = activeTutors.slice(0, maxDisplay);
                            let remaining = activeTutors.length - maxDisplay;

                            let badges = displayed.map(t => {
                                let isFull = t.shift.includes("全節") || t.shift.includes("15:00-18:00");
                                let badgeColor = isFull ? "bg-emerald-50 text-emerald-700 border-emerald-200" : "bg-amber-50 text-amber-700 border-amber-200";
                                let dotColor = isFull ? "bg-emerald-500" : "bg-amber-500";
                                return `<div class="text-xs px-2 py-1 rounded-lg border ${badgeColor} flex items-center justify-between gap-1 mb-1 truncate">
                                    <span class="font-medium truncate"><span class="w-1.5 h-1.5 rounded-full ${dotColor} inline-block mr-1"></span>${t.name}</span>
                                    <span class="text-[10px] opacity-75">${isFull ? "全" : "功"}</span>
                                </div>`;
                            }).join('');

                            if (remaining > 0) {
                                badges += `<button onclick='openDayModal(${item.dayNum}, ${JSON.stringify(activeTutors)})' class="w-full text-center text-xs text-indigo-600 hover:text-indigo-800 font-medium py-1 bg-indigo-50/50 hover:bg-indigo-50 rounded-lg transition">還有 +${remaining} 位...</button>`;
                            }

                            bodyHTML = `<div class="flex-grow space-y-1">${roomSummaryHTML}${badges}</div>`;
                        }
                    }

                    let footerHTML = `
                        <div class="mt-2 pt-2 border-t border-slate-100 flex justify-between items-center text-xs">
                            <span class="text-slate-400 font-medium">${item.isHolidayOrSpecial ? '0 更次' : activeTutors.length + ' 位導師'}</span>

                schoolDays.forEach(d => {

                    let assignedTutors = roomAssignments[dateKey][room];

                    rawData.forEach(t => {

                            let selectHTML = '';

        function toggleMatrixAssignment(dateKey, roomName, tutorName, isChecked) {
            if (!roomAssignments[dateKey]) roomAssignments[dateKey] = {};

            for (let r in roomAssignments[dateKey]) {
                roomAssignments[dateKey][r] = (roomAssignments[dateKey][r] || []).filter(item => item.name !== tutorName);
            }

            if (isChecked) {
                if (!roomAssignments[dateKey][roomName]) {
                    roomAssignments[dateKey][roomName] = [];
                }
                let tutorObj = rawData.find(t => t.name === tutorName);
                let defaultSlot = '功';
                if (tutorObj && tutorObj.shifts[dateKey]) {
                    let s = tutorObj.shifts[dateKey];
                    if (s.includes("全節") || s.includes("15:00-18:00")) defaultSlot = '全';
                }
                roomAssignments[dateKey][roomName].push({ name: tutorName, slot: defaultSlot });
                showToast(`已指派 ${tutorName} 至 ${roomName}`);
            } else {
                showToast(`已取消 ${tutorName} 的指派`);
            }

            renderRoomMatrix();
        }

        function updateMatrixSlot(dateKey, roomName, tutorName, slotVal) {
            if (roomAssignments[dateKey] && roomAssignments[dateKey][roomName]) {
                let assignment = roomAssignments[dateKey][roomName].find(item => item.name === tutorName);
                if (assignment) {
                    assignment.slot = slotVal;
                    showToast(`已更新 ${tutorName} 在 ${roomName} 的時段為 ${slotVal === '全' ? '全' : '功'}`);
                }
            }
        }

        function autoAssignMatrixWeek() {
            const weekIndex = parseInt(document.getElementById('matrixWeekSelect').value || 0);
            const weekObj = calendarWeeks[weekIndex];
            let schoolDays = weekObj.days.filter(d => !d.isSpacer && d.dateStr && !d.isHolidayOrSpecial);

            if (schoolDays.length === 0) {
                showToast("本週沒有上課日可供自動分配", false);
                return;
            }

            schoolDays.forEach(d => {
                let dateKey = d.dateStr;
                let availableTutors = [];
                rawData.forEach(t => {
                    let shift = t.shifts[dateKey];
                    if (!shift) {
                        let foundKey = Object.keys(t.shifts).find(k => k.startsWith(`${d.dayNum}/${currentMonth}/`));
                        if (foundKey) shift = t.shifts[foundKey];
                    }
                    if (shift && shift !== "不能出席" && shift.trim() !== "") {
                        let isFull = shift.includes("全節") || shift.includes("15:00-18:00");
                        availableTutors.push({ name: t.name, defaultSlot: isFull ? '全' : '功' });
                    }
                });

                if (availableTutors.length > 0) {
                    if (!roomAssignments[dateKey]) roomAssignments[dateKey] = {};
                    roomList.forEach(room => { roomAssignments[dateKey][room] = []; });

                    let shuffled = [...availableTutors].sort(() => 0.5 - Math.random());
                    shuffled.forEach((t, i) => {
                        let targetRoom = roomList[i % roomList.length];
                        roomAssignments[dateKey][targetRoom].push({ name: t.name, slot: t.defaultSlot });
                    });
                }
            });

            showToast("已成功隨機自動分配本週所有上課日的導師！");
            renderRoomMatrix();
        }

        function checkUnassignedRooms() {
            const weekIndex = parseInt(document.getElementById('matrixWeekSelect').value || 0);
            const weekObj = calendarWeeks[weekIndex];
            let schoolDays = weekObj.days.filter(d => !d.isSpacer && d.dateStr && !d.isHolidayOrSpecial);

            let unassignedList = [];

            schoolDays.forEach(d => {
                let dateKey = d.dateStr;
                let availableTutorsCount = 0;

                    if (!shift) {

        function exportRoomAssignmentExcel() {
            try {
                if (typeof XLSX === 'undefined') {
                    showToast("Excel 庫尚未加載完成，請稍候再試", false);
                    return;
                }

                let excelData = [];
                excelData.push([`在校課後託管導師報更及課室分配 - ${currentYear}年${currentMonth}月份月曆總表`]);
                excelData.push([]);

                let dayHeaders = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];
                excelData.push(dayHeaders);

                calendarWeeks.forEach(weekObj => {
                    let dateRow = [];
                    let contentRows = {};
                    roomList.forEach(r => contentRows[r] = ["", "", "", "", "", "", ""]);

                    weekObj.days.forEach((d, dayIdx) => {
                        if (d.isSpacer || !d.dayNum) {
                            dateRow.push("");
                        } else {
                            let dateLabel = `${currentMonth}/${d.dayNum}`;
                            if (d.isHolidayOrSpecial) {
                                dateLabel += ` (假期)`;
                            }
                            dateRow.push(dateLabel);

                            if (!d.isHolidayOrSpecial && d.dateStr && roomAssignments[d.dateStr]) {
                                roomList.forEach(room => {
                                    let tutors = roomAssignments[d.dateStr][room] || [];
                                    if (tutors.length > 0) {
                                        let tutorStrs = tutors.map(t => `${room}-${t.name}-${t.slot}`).join(', ');
                                        contentRows[room][dayIdx] = tutorStrs;
                                    }
                                });
                            }
                        }
                    });

                    excelData.push(dateRow);

                    roomList.forEach(room => {
                        let row = [];
                        for (let i = 0; i < 7; i++) {
                            row.push(contentRows[room][i] || (weekObj.days[i].isSpacer ? "" : "-"));
                        }
                        excelData.push(row);
                    });

                    excelData.push([]);
                });

                const ws = XLSX.utils.aoa_to_sheet(excelData);
                let colWidths = [];
                for (let i = 0; i < 7; i++) {
                    colWidths.push({wch: 35});
                }
                ws['!cols'] = colWidths;

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, `${currentMonth}月月曆分配總表`);

                XLSX.writeFile(wb, `Room_Calendar_Report_${currentYear}_${currentMonth}.xlsx`);
                showToast("成功匯出月曆格式 Excel 報表！");
            } catch (err) {
                console.error("Excel export error:", err);
                showToast("匯出 Excel 發生錯誤，請稍後再試", false);
            }
        }

        function parseCSV(text) {
            let lines = [];
            let row = [];
            let inQuotes = false;
            let field = '';
            
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let nextC = text[i + 1];
                
                if (c === '"') {
                    if (inQuotes && nextC === '"') {
                        field += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (c === ',' && !inQuotes) {
                    row.push(field.trim());
                    field = '';
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && nextC === '\n') { i++; }
                    row.push(field.trim());
                    if (row.length > 1 || row[0] !== '') {
                        lines.push(row);
                    }
                    row = [];
                    field = '';
                } else {
                    field += c;
                }
            }
            if (field !== '' || row.length > 0) {
                row.push(field.trim());
                lines.push(row);
            }
            return lines;
        }

        function handleCsvImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const csvText = e.target.result;
                    const rows = parseCSV(csvText);
                    
                    if (rows.length < 2) {
                        showToast("CSV檔案格式錯誤或內容過少", false);
                        return;
                    }

                    const headers = rows[0];
                    activeDateKeys = headers.slice(6);
                    
                    let newRawData = [];
                    for (let i = 1; i < rows.length; i++) {
                        let r = rows[i];
                        if (r.length < 6) continue;
                        
                        let tutorName = r[5] || r[4] || `導師 ${i}`;
                        let shiftsObj = {};
                        
                        for (let j = 6; j < headers.length; j++) {
                            if (j < r.length && headers[j]) {
                                shiftsObj[headers[j]] = r[j] || "不能出席";
                            }
                        }

                        newRawData.push({
                            id: i,
                            name: tutorName,
                            shifts: shiftsObj
                        });
                    }

                    if (newRawData.length > 0) {
                        rawData = newRawData;
                        buildCalendarStructure();
                        renderViews();
                        document.getElementById('dataSourceBadge').innerText = `已載入: ${file.name}`;
                        showToast(`成功匯入 ${newRawData.length} 位導師的報更數據！`);
                    } else {
                        showToast("未能從CSV解析出有效的導師數據", false);
                    }
                } catch (err) {
                    console.error(err);
                    showToast("解析 CSV 失敗，請確認檔案格式正確", false);
                }
                event.target.value = '';
            };
            reader.readAsText(file, 'UTF-8');
        }

        window.onload = function() {
            buildCalendarStructure();
            renderViews();
        };
    </script>
</body>
</html>
